[[exercise]]
id = "fts-1"
hints = 2
solution = ["SELECT title FROM docs WHERE docs MATCH 'fast';"]
setup = [
  { do = "sql", script = "CREATE VIRTUAL TABLE docs USING fts5(title, body);\nINSERT INTO docs VALUES\n  ('SQLite intro', 'SQLite is a small, fast, reliable database engine'),\n  ('Joins', 'A join combines rows from two tables'),\n  ('Indexes', 'An index makes searches fast without scanning the whole table'),\n  ('Window functions', 'Window functions compute values across related rows');" },
]
checks = [
  { type = "last_result_same_as", sql = "SELECT title FROM docs WHERE body LIKE '%fast%'" },
  { type = "ran", any = ["MATCH"] },
]

