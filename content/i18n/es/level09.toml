"window-functions.title" = "Funciones de ventana"
"window-functions.theory" = """
Una función de ventana calcula sobre un conjunto de filas relacionadas pero, a diferencia de GROUP BY, conserva todas las filas. OVER (...) define la ventana:

  SELECT name, department_id, salary,
         RANK() OVER (PARTITION BY department_id ORDER BY salary DESC) AS pos
  FROM employees;

PARTITION BY separa las filas en grupos (como GROUP BY) y ORDER BY ordena dentro de cada uno. Funciones útiles: ROW_NUMBER(), RANK() (los empates comparten posición), DENSE_RANK(), LAG(x), LEAD(x) y cualquier agregación usada con OVER:

  SUM(salary) OVER (ORDER BY hired_at)       -- total acumulado"""
"win-1.prompt" = "Mostrá name, department_id, salary y salary_rank de los empleados que tienen departamento. salary_rank es el RANK() del sueldo dentro del departamento, del sueldo más alto al más bajo."
"win-1.hint1" = "RANK() OVER (PARTITION BY department_id ORDER BY salary DESC), y WHERE department_id IS NOT NULL."
"win-1.hint2" = "SELECT name, department_id, salary, RANK() OVER (PARTITION BY department_id ORDER BY salary DESC) AS salary_rank FROM employees WHERE department_id IS NOT NULL;"
"win-1.check1.fail" = "Tu última consulta no devuelve las filas pedidas (o todavía no ejecutaste ninguna). Corregila y ejecutala de nuevo."
"win-2.prompt" = "Mostrá name, hired_at y running_payroll: el total acumulado de sueldos en orden de contratación (usá el id para desempatar)."
"win-2.hint1" = "SUM(salary) OVER (ORDER BY hired_at, id)."
"win-2.hint2" = "SELECT name, hired_at, SUM(salary) OVER (ORDER BY hired_at, id) AS running_payroll FROM employees;"
"win-2.check1.fail" = "Tu última consulta no devuelve las filas pedidas (o todavía no ejecutaste ninguna). Corregila y ejecutala de nuevo."
"triggers.title" = "Triggers"
"triggers.theory" = """
Un trigger ejecuta SQL solo cuando se inserta, actualiza o borra una fila. Adentro, OLD es la fila antes y NEW la fila después:

  CREATE TRIGGER price_audit
  AFTER UPDATE OF price ON products
  BEGIN
    INSERT INTO price_log (product_id, old_price, new_price)
    VALUES (OLD.id, OLD.price, NEW.price);
  END;

Usos típicos: registros de auditoría, mantener datos derivados al día y bloquear cambios con SELECT RAISE(ABORT, 'mensaje') dentro de un trigger BEFORE. Todo el CREATE TRIGGER es una sola sentencia: la consola espera el END; antes de ejecutarla. Se borra con DROP TRIGGER."""
"trigger-1.prompt" = "Creá un trigger price_audit que, después de que cambie el precio de un producto, inserte su id, precio viejo y precio nuevo en price_log. Después cambiá el precio del producto 1 (Pen) a 1.5 para que el trigger lo registre."
"trigger-1.hint1" = "CREATE TRIGGER ... AFTER UPDATE OF price ON products BEGIN INSERT ... VALUES (OLD.id, OLD.price, NEW.price); END;"
"trigger-1.hint2" = "CREATE TRIGGER price_audit AFTER UPDATE OF price ON products BEGIN INSERT INTO price_log (product_id, old_price, new_price) VALUES (OLD.id, OLD.price, NEW.price); END;\nUPDATE products SET price = 1.5 WHERE id = 1;"
"trigger-1.check1.fail" = "El trigger price_audit sobre products todavía no existe."
"trigger-1.check2.fail" = "price_log debería tener una fila: producto 1, de 1.2 a 1.5. Cambiá el precio después de crear el trigger."
"trigger-1.check3.fail" = "El precio del producto 1 tiene que ser 1.5."
"json.title" = "JSON en SQLite"
"json.theory" = """
SQLite guarda JSON como texto y tiene funciones para leerlo:

  json_extract(payload, '$.user')        valor en una ruta
  payload ->> '$.user'                   lo mismo, más corto
  json_array_length(payload, '$.tags')   largo de un arreglo
  json_each(payload, '$.tags')           una fila por elemento (una función que devuelve tabla)
  json_valid(x)                          ¿es JSON válido?

  SELECT e.id, t.value
  FROM events e, json_each(e.payload, '$.tags') AS t;

Las rutas empiezan con $; usá .clave para objetos y [0] para posiciones de arreglos. JSON sirve para datos sueltos, pero las columnas relacionales son mejores para lo que filtrás y unís."""
"json-1.prompt" = "La columna payload de events guarda JSON. Mostrá el id de cada evento y el user que está dentro del JSON (columna user)."
"json-1.hint1" = "json_extract(payload, '$.user') o payload ->> '$.user'."
"json-1.hint2" = "SELECT id, json_extract(payload, '$.user') AS user FROM events;"
"json-1.check1.fail" = "Tu última consulta no devuelve las filas pedidas (o todavía no ejecutaste ninguna). Corregila y ejecutala de nuevo."
"json-2.prompt" = "Mostrá una fila por cada tag de cada evento: el id del evento (id) y el tag (tag). Los eventos sin tags no aparecen."
"json-2.hint1" = "FROM events e, json_each(e.payload, '$.tags') AS t y seleccioná t.value."
"json-2.hint2" = "SELECT e.id, t.value AS tag FROM events e, json_each(e.payload, '$.tags') AS t;"
"json-2.check1.fail" = "Tu última consulta no devuelve las filas pedidas (o todavía no ejecutaste ninguna). Corregila y ejecutala de nuevo."
"fts5.title" = "Búsqueda de texto completo con FTS5"
"fts5.theory" = """
LIKE '%palabra%' lee todas las filas y no puede ordenar por relevancia. FTS5 arma un índice de texto completo en una tabla virtual:

  CREATE VIRTUAL TABLE docs USING fts5(title, body);
  INSERT INTO docs VALUES ('Joins', 'A join combines rows from two tables');
  SELECT title FROM docs WHERE docs MATCH 'rows';
  SELECT title FROM docs WHERE docs MATCH 'body:join OR title:index' ORDER BY rank;

MATCH entiende palabras, AND / OR / NOT, "frases exactas", prefijos (data*) y filtros por columna (title:sql). ORDER BY rank ordena por relevancia. FTS5 viene incluido en el SQLite embebido de este programa."""
"fts-1.prompt" = "Usando la búsqueda de texto completo (MATCH), mostrá el título de los documentos de docs que mencionan la palabra fast."
"fts-1.hint1" = "WHERE docs MATCH 'fast' (el nombre de la tabla va a la izquierda de MATCH)."
"fts-1.hint2" = "SELECT title FROM docs WHERE docs MATCH 'fast';"
"fts-1.check1.fail" = "Tu última consulta no devuelve las filas pedidas (o todavía no ejecutaste ninguna). Corregila y ejecutala de nuevo."
"fts-1.check2.fail" = "Usá MATCH como se pidió."
"fts-2.prompt" = "Creá una tabla virtual FTS5 llamada notes con las columnas title y body, e insertale dos notas."
"fts-2.hint1" = "CREATE VIRTUAL TABLE notes USING fts5(title, body);"
"fts-2.hint2" = "CREATE VIRTUAL TABLE notes USING fts5(title, body);\nINSERT INTO notes VALUES ('Shopping', 'milk and eggs'), ('Ideas', 'learn full-text search');"
"fts-2.check1.fail" = "notes tiene que ser una tabla virtual USING fts5."
"fts-2.check2.fail" = "notes debería contener exactamente dos notas."
