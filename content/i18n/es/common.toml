"exam.q1-where.text" = "¿Qué consulta devuelve los productos que cuestan más de 100?"
"exam.q1-where.opt1" = "SELECT * FROM products WHERE price > 100;"
"exam.q1-where.opt2" = "SELECT * FROM products IF price > 100;"
"exam.q1-where.opt3" = "SELECT price > 100 FROM products ONLY;"
"exam.q1-where.opt4" = "FILTER products BY price > 100;"
"exam.q1-null.text" = "¿Cómo se encuentran los clientes que no tienen email (NULL)?"
"exam.q1-null.opt1" = "WHERE email = NULL"
"exam.q1-null.opt2" = "WHERE email IS NULL"
"exam.q1-null.opt3" = "WHERE email = ''"
"exam.q1-null.opt4" = "WHERE NOT email"
"exam.q2-count.text" = "¿Cuál es la diferencia entre count(*) y count(email)?"
"exam.q2-count.opt1" = "No hay ninguna"
"exam.q2-count.opt2" = "count(email) cuenta solo los emails distintos"
"exam.q2-count.opt3" = "count(*) ignora las filas con NULL"
"exam.q2-count.opt4" = "count(*) cuenta todas las filas; count(email) saltea las filas donde email es NULL"
"exam.q2-having.text" = "Querés las categorías que tienen más de 2 productos. ¿Dónde va la condición?"
"exam.q2-having.opt1" = "WHERE count(*) > 2, antes de GROUP BY"
"exam.q2-having.opt2" = "HAVING count(*) > 2, después de GROUP BY"
"exam.q2-having.opt3" = "ORDER BY count(*) > 2"
"exam.q2-having.opt4" = "LIMIT count(*) > 2"
"exam.q3-left.text" = "¿Qué join conserva a los clientes que no tienen pedidos?"
"exam.q3-left.opt1" = "customers INNER JOIN orders"
"exam.q3-left.opt2" = "customers CROSS JOIN orders"
"exam.q3-left.opt3" = "customers LEFT JOIN orders"
"exam.q3-left.opt4" = "orders INNER JOIN customers"
"exam.q3-cross.text" = "¿Qué pasa cuando un JOIN no tiene condición ON?"
"exam.q3-cross.opt1" = "Siempre falla"
"exam.q3-cross.opt2" = "Cada fila se empareja con todas las filas (producto cartesiano)"
"exam.q3-cross.opt3" = "No devuelve filas"
"exam.q3-cross.opt4" = "Une las filas con el mismo id"
"exam.q4-exists.text" = "¿Cuándo es verdadero EXISTS (subconsulta)?"
"exam.q4-exists.opt1" = "Cuando la subconsulta devuelve al menos una fila"
"exam.q4-exists.opt2" = "Cuando la subconsulta devuelve el valor TRUE"
"exam.q4-exists.opt3" = "Cuando la subconsulta devuelve exactamente una fila"
"exam.q4-exists.opt4" = "Cuando la subconsulta no devuelve ningún NULL"
"exam.q4-except.text" = "¿Qué operador devuelve las filas de la primera consulta que no están en la segunda?"
"exam.q4-except.opt1" = "UNION"
"exam.q4-except.opt2" = "INTERSECT"
"exam.q4-except.opt3" = "EXCEPT"
"exam.q4-except.opt4" = "JOIN"
"exam.q5-update.text" = "¿Qué hace UPDATE tasks SET done = 1; (sin WHERE)?"
"exam.q5-update.opt1" = "Falla: WHERE es obligatorio"
"exam.q5-update.opt2" = "Actualiza solo la primera fila"
"exam.q5-update.opt3" = "Actualiza todas las filas de la tabla"
"exam.q5-update.opt4" = "No actualiza nada"
"exam.q5-upsert.text" = "¿Qué hace INSERT ... ON CONFLICT DO UPDATE cuando la clave ya existe?"
"exam.q5-upsert.opt1" = "Falla con un error"
"exam.q5-upsert.opt2" = "Inserta una fila duplicada"
"exam.q5-upsert.opt3" = "Borra la fila vieja"
"exam.q5-upsert.opt4" = "Actualiza la fila existente en vez de insertar"
