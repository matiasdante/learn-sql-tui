"create-table.title" = "CREATE TABLE"
"create-table.theory" = """
CREATE TABLE define una tabla: un nombre y luego cada columna con su tipo y restricciones:

  CREATE TABLE books (
    id    INTEGER PRIMARY KEY,
    title TEXT NOT NULL,
    year  INTEGER
  );

PRIMARY KEY identifica cada fila (un INTEGER PRIMARY KEY se completa solo con 1, 2, 3...). NOT NULL prohíbe valores faltantes. DEFAULT da un valor cuando el INSERT omite la columna. CHECK rechaza valores que rompen una regla:

  status TEXT NOT NULL DEFAULT 'active' CHECK (status IN ('active', 'banned'))

Usá .schema books para ver cómo se creó una tabla."""
"create-1.prompt" = "Creá una tabla books con: id (INTEGER, clave primaria), title (TEXT, obligatorio) y year (INTEGER)."
"create-1.hint1" = "Obligatorio significa NOT NULL."
"create-1.hint2" = "CREATE TABLE books (id INTEGER PRIMARY KEY, title TEXT NOT NULL, year INTEGER);"
"create-1.check1.fail" = "La tabla books todavía no existe."
"create-1.check2.fail" = "books.id tiene que ser un INTEGER PRIMARY KEY."
"create-1.check3.fail" = "books.title tiene que ser TEXT NOT NULL."
"create-1.check4.fail" = "books.year tiene que ser una columna INTEGER."
"create-2.prompt" = "Creá una tabla members con: name (TEXT, obligatorio), status (TEXT, obligatorio, por defecto 'active', y solo 'active' o 'banned' permitidos con un CHECK) y points (INTEGER, por defecto 0)."
"create-2.hint1" = "status TEXT NOT NULL DEFAULT 'active' CHECK (status IN ('active', 'banned'))."
"create-2.hint2" = "CREATE TABLE members (name TEXT NOT NULL, status TEXT NOT NULL DEFAULT 'active' CHECK (status IN ('active', 'banned')), points INTEGER DEFAULT 0);"
"create-2.check1.fail" = "La tabla members todavía no existe."
"create-2.check2.fail" = "members.name tiene que ser NOT NULL."
"create-2.check3.fail" = "members.status necesita DEFAULT 'active'."
"create-2.check4.fail" = "members.status tiene que ser NOT NULL."
"create-2.check5.fail" = "members.points necesita DEFAULT 0."
"create-2.check6.fail" = "Agregá un CHECK para el status."
"types-strict.title" = "Tipos y tablas STRICT"
"types-strict.theory" = """
SQLite es flexible con los tipos: una columna tiene una afinidad (un tipo preferido), no una regla. Podés guardar el texto 'hello' en una columna INTEGER y lo acepta. Las clases de almacenamiento son NULL, INTEGER, REAL, TEXT y BLOB; typeof(x) dice cuál tiene un valor.

Para tener una verificación estricta como en otras bases, agregá STRICT después del paréntesis de cierre:

  CREATE TABLE readings (
    sensor TEXT,
    value  REAL
  ) STRICT;

Una tabla STRICT acepta solo INT, INTEGER, REAL, TEXT, BLOB y ANY como tipos de columna, y rechaza valores que no encajan. Probalo: INSERT INTO readings VALUES ('a', 'not a number'); falla."""
"strict-1.prompt" = "Creá una tabla STRICT readings con una columna TEXT sensor y una columna REAL value."
"strict-1.hint1" = "La palabra STRICT va después del paréntesis de cierre."
"strict-1.hint2" = "CREATE TABLE readings (sensor TEXT, value REAL) STRICT;"
"strict-1.check1.fail" = "La tabla readings todavía no existe."
"strict-1.check2.fail" = "readings.sensor tiene que ser TEXT."
"strict-1.check3.fail" = "readings.value tiene que ser REAL."
"strict-1.check4.fail" = "La tabla tiene que estar declarada STRICT."
"constraints.title" = "Restricciones: UNIQUE, NOT NULL, CHECK"
"constraints.theory" = """
Las restricciones hacen que la base rechace datos incorrectos, sin importar qué programa escriba en ella:

  NOT NULL    el valor es obligatorio
  UNIQUE      dos filas no pueden repetir el valor (se crea un índice único para eso)
  CHECK(...)  la condición debe ser verdadera
  PRIMARY KEY único e identifica la fila

  CREATE TABLE users (
    id    INTEGER PRIMARY KEY,
    email TEXT NOT NULL UNIQUE,
    age   INTEGER CHECK (age >= 0)
  );

Un INSERT o UPDATE que las viole falla con un error como UNIQUE constraint failed: users.email, y no se escribe nada. Las reglas impuestas acá protegen los datos frente a todas las aplicaciones."""
"constraints-1.prompt" = "Creá una tabla users con: id (INTEGER clave primaria), email (TEXT, obligatorio y único) y age (INTEGER, solo se permite 0 o más con un CHECK)."
"constraints-1.hint1" = "email TEXT NOT NULL UNIQUE, age INTEGER CHECK (age >= 0)."
"constraints-1.hint2" = "CREATE TABLE users (id INTEGER PRIMARY KEY, email TEXT NOT NULL UNIQUE, age INTEGER CHECK (age >= 0));"
"constraints-1.check1.fail" = "La tabla users todavía no existe."
"constraints-1.check2.fail" = "users.id tiene que ser la clave primaria."
"constraints-1.check3.fail" = "users.email tiene que ser NOT NULL."
"constraints-1.check4.fail" = "users.email tiene que ser UNIQUE."
"constraints-1.check5.fail" = "Agregá un CHECK sobre age."
"foreign-keys.title" = "Claves foráneas y ON DELETE"
"foreign-keys.theory" = """
Una clave foránea hace que una columna apunte a la clave primaria de otra tabla, así no puede haber un post cuyo autor no existe:

  CREATE TABLE posts (
    id        INTEGER PRIMARY KEY,
    author_id INTEGER NOT NULL REFERENCES authors(id) ON DELETE CASCADE,
    title     TEXT
  );

ON DELETE dice qué pasa cuando se borra la fila padre:
  NO ACTION / RESTRICT   rechaza el borrado (por defecto)
  CASCADE                borra también a los hijos
  SET NULL               pone la columna hija en NULL
  SET DEFAULT            la pone en su valor por defecto

Importante: SQLite solo aplica las claves foráneas cuando PRAGMA foreign_keys = ON (nivel 7)."""
"fk-1.prompt" = "La tabla authors ya existe. Creá una tabla posts con id (INTEGER clave primaria), author_id (INTEGER, obligatorio, que referencie a authors(id) de modo que borrar un autor borre sus posts) y title (TEXT)."
"fk-1.hint1" = "author_id INTEGER NOT NULL REFERENCES authors(id) ON DELETE CASCADE."
"fk-1.hint2" = "CREATE TABLE posts (id INTEGER PRIMARY KEY, author_id INTEGER NOT NULL REFERENCES authors(id) ON DELETE CASCADE, title TEXT);"
"fk-1.check1.fail" = "La tabla posts todavía no existe."
"fk-1.check2.fail" = "posts.author_id tiene que ser NOT NULL."
"fk-1.check3.fail" = "posts.author_id tiene que referenciar a authors(id)."
"fk-1.check4.fail" = "Agregá ON DELETE CASCADE a la clave foránea."
"alter-table.title" = "ALTER TABLE"
"alter-table.theory" = """
ALTER TABLE cambia una tabla que ya tiene datos:

  ALTER TABLE tasks ADD COLUMN due_date TEXT;          columna nueva (las filas existentes reciben NULL)
  ALTER TABLE tasks RENAME COLUMN title TO name;
  ALTER TABLE tasks RENAME TO todos;
  ALTER TABLE tasks DROP COLUMN priority;

ADD COLUMN tiene límites: una columna nueva NOT NULL necesita un DEFAULT, y no puede ser PRIMARY KEY ni UNIQUE. Para cambios más grandes, creá la tabla nueva, copiá los datos con INSERT ... SELECT, borrá la vieja y renombrá la nueva."""
"alter-1.prompt" = "Agregá una columna TEXT llamada due_date a la tabla tasks. Conservá sus 5 filas."
"alter-1.hint1" = "ALTER TABLE tasks ADD COLUMN ..."
"alter-1.hint2" = "ALTER TABLE tasks ADD COLUMN due_date TEXT;"
"alter-1.check1.fail" = "tasks necesita una columna TEXT llamada due_date."
"alter-1.check2.fail" = "Las 5 filas originales tienen que quedar."
"alter-2.prompt" = "Renombrá la columna title de tasks a name y después renombrá la tabla tasks a todos."
"alter-2.hint1" = "Dos sentencias: RENAME COLUMN ... TO ... y después RENAME TO ..."
"alter-2.hint2" = "ALTER TABLE tasks RENAME COLUMN title TO name;\nALTER TABLE tasks RENAME TO todos;"
"alter-2.check1.fail" = "La tabla tiene que llamarse todos."
"alter-2.check2.fail" = "El nombre viejo tasks ya no tiene que existir."
"alter-2.check3.fail" = "La columna tiene que llamarse name."
"alter-2.check4.fail" = "Las 5 filas tienen que conservarse."
"drop.title" = "DROP: eliminar tablas"
"drop.theory" = """
DROP TABLE elimina una tabla junto con todas sus filas, índices y triggers:

  DROP TABLE counters;
  DROP TABLE IF EXISTS counters;     -- sin error si ya no existe

También existen DROP VIEW, DROP INDEX y DROP TRIGGER. No hay deshacer (salvo una transacción todavía sin confirmar, o un backup). Si otras tablas la referencian con claves foráneas y PRAGMA foreign_keys está ON, SQLite comprueba que el borrado no deje huérfanos."""
"drop-1.prompt" = "Eliminá por completo la tabla counters. La tabla tasks tiene que quedar."
"drop-1.hint1" = "DROP TABLE counters;"
"drop-1.hint2" = "DROP TABLE counters;"
"drop-1.check1.fail" = "La tabla counters todavía existe."
"drop-1.check2.fail" = "No borres tasks."
"generated-columns.title" = "Columnas generadas"
"generated-columns.theory" = """
Una columna generada se calcula a partir de otras columnas de la misma fila, así que nunca queda desincronizada:

  CREATE TABLE items (
    price REAL,
    qty   INTEGER,
    total REAL GENERATED ALWAYS AS (price * qty) VIRTUAL
  );

Las columnas VIRTUAL se calculan al leer; las STORED se guardan en disco al escribir la fila (y se pueden indexar). No se puede hacer INSERT en una columna generada. ALTER TABLE ... ADD COLUMN puede agregar las VIRTUAL:

  ALTER TABLE items ADD COLUMN total REAL GENERATED ALWAYS AS (price * qty);

Las columnas generadas no siempre aparecen con SELECT *; pedilas por nombre."""
"generated-1.prompt" = "La tabla items tiene price y qty. Agregá una columna generada total que siempre sea igual a price * qty."
"generated-1.hint1" = "ALTER TABLE items ADD COLUMN total REAL GENERATED ALWAYS AS (price * qty);"
"generated-1.hint2" = "ALTER TABLE items ADD COLUMN total REAL GENERATED ALWAYS AS (price * qty);"
"generated-1.check1.fail" = "items necesita una columna generada llamada total."
"generated-1.check2.fail" = "total tiene que ser igual a price * qty en cada fila."
