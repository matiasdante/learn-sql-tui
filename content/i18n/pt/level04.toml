"subqueries.title" = "Subconsultas: uma consulta dentro de outra"
"subqueries.theory" = """
Uma subconsulta é um SELECT entre parênteses usado como valor ou como lista. Uma subconsulta escalar devolve um único valor:

  SELECT name, price FROM products
  WHERE price > (SELECT avg(price) FROM products);

Uma subconsulta que devolve uma coluna pode alimentar um IN:

  SELECT name FROM customers
  WHERE id IN (SELECT customer_id FROM orders);

A consulta interna roda primeiro; a externa usa o resultado dela."""
"subq-1.prompt" = "Mostre o nome e o preço dos produtos que custam mais que o preço médio de todos os produtos."
"subq-1.hint1" = "Compare price com (SELECT avg(price) FROM products)."
"subq-1.hint2" = "SELECT name, price FROM products WHERE price > (SELECT avg(price) FROM products);"
"subq-1.check1.fail" = "Sua última consulta não devolve as linhas pedidas (ou você ainda não executou nenhuma). Corrija e execute de novo."
"subq-2.prompt" = "Mostre o nome dos clientes que fizeram pelo menos um pedido."
"subq-2.hint1" = "id IN (SELECT customer_id FROM orders)."
"subq-2.hint2" = "SELECT name FROM customers WHERE id IN (SELECT customer_id FROM orders);"
"subq-2.check1.fail" = "Sua última consulta não devolve as linhas pedidas (ou você ainda não executou nenhuma). Corrija e execute de novo."
"exists-correlated.title" = "EXISTS e subconsultas correlacionadas"
"exists-correlated.theory" = """
Uma subconsulta correlacionada menciona uma coluna da consulta externa, então roda uma vez para cada linha externa. EXISTS é verdadeiro quando a subconsulta devolve pelo menos uma linha:

  SELECT name FROM customers c
  WHERE EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.id);

O que a subconsulta seleciona não importa com EXISTS (SELECT 1 é o costume). A correlação também serve para valores:

  SELECT name, price, category FROM products p
  WHERE price > (SELECT avg(price) FROM products WHERE category = p.category);

NOT EXISTS mantém as linhas sem correspondência e, ao contrário do NOT IN, é seguro quando a subconsulta contém NULL."""
"exists-1.prompt" = "Usando EXISTS, mostre o nome dos clientes que têm pelo menos um pedido pending."
"exists-1.hint1" = "A subconsulta procura pedidos desse cliente com status = 'pending'."
"exists-1.hint2" = "SELECT name FROM customers c WHERE EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.id AND o.status = 'pending');"
"exists-1.check1.fail" = "Sua última consulta não devolve as linhas pedidas (ou você ainda não executou nenhuma). Corrija e execute de novo."
"exists-1.check2.fail" = "Use EXISTS como pedido."
"corr-1.prompt" = "Mostre o nome, a categoria e o preço dos produtos que custam mais que o preço médio da sua própria categoria."
"corr-1.hint1" = "A subconsulta calcula a média dos produtos com category = p.category (a linha externa)."
"corr-1.hint2" = "SELECT name, category, price FROM products p WHERE price > (SELECT avg(price) FROM products WHERE category = p.category);"
"corr-1.check1.fail" = "Sua última consulta não devolve as linhas pedidas (ou você ainda não executou nenhuma). Corrija e execute de novo."
"set-operations.title" = "UNION, INTERSECT e EXCEPT"
"set-operations.theory" = """
As operações de conjuntos combinam os resultados de dois SELECT com a mesma quantidade de colunas:

  UNION       linhas de ambos, sem duplicatas (UNION ALL mantém duplicatas e é mais rápido)
  INTERSECT   linhas que aparecem nos dois
  EXCEPT      linhas do primeiro que não estão no segundo

  SELECT id FROM customers
  EXCEPT
  SELECT customer_id FROM orders;       -- clientes sem pedidos

Só é permitido um ORDER BY, no final de tudo."""
"union-1.prompt" = "Mostre uma só lista com os nomes dos clientes do UK junto com os nomes dos clientes de Boston."
"union-1.hint1" = "Dois SELECT unidos por UNION."
"union-1.hint2" = "SELECT name FROM customers WHERE country = 'UK' UNION SELECT name FROM customers WHERE city = 'Boston';"
"union-1.check1.fail" = "Sua última consulta não devolve as linhas pedidas (ou você ainda não executou nenhuma). Corrija e execute de novo."
"union-1.check2.fail" = "Use UNION como pedido."
