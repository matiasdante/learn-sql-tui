"intersect-1.hint1" = "Um SELECT por status, unidos por INTERSECT."
"intersect-1.hint2" = "SELECT customer_id FROM orders WHERE status = 'pending' INTERSECT SELECT customer_id FROM orders WHERE status = 'shipped';"
"intersect-1.check1.fail" = "Sua última consulta não devolve as linhas pedidas (ou você ainda não executou nenhuma). Corrija e execute de novo."
"intersect-1.check2.fail" = "Use INTERSECT como pedido."
"except-1.prompt" = "Mostre o id dos clientes que nunca fizeram um pedido, usando EXCEPT."
"except-1.hint1" = "Todos os ids de clientes EXCEPT os customer_id de orders."
"except-1.hint2" = "SELECT id FROM customers EXCEPT SELECT customer_id FROM orders;"
