"cte.title" = "WITH: expressões de tabela comuns"
"cte.theory" = """
Uma CTE dá nome a uma subconsulta para que a consulta principal seja lida de cima para baixo:

  WITH totals AS (
    SELECT order_id, sum(quantity) AS items
    FROM order_items
    GROUP BY order_id
  )
  SELECT order_id, items FROM totals WHERE items > 5;

Pense nela como uma view temporária que vive durante uma instrução. Você pode definir várias, separadas por vírgulas, e as seguintes podem usar as anteriores."""
"cte-1.prompt" = "Use uma cláusula WITH para calcular o total de cada pedido (soma de quantidade vezes preço) e mostre os pedidos cujo total passa de 1000, como order_id e total."
"cte-1.hint1" = "Na CTE: JOIN de order_items com products e GROUP BY order_id. Depois filtre a CTE."
"cte-1.hint2" = "WITH totals AS (SELECT oi.order_id, sum(oi.quantity * p.price) AS total FROM order_items oi JOIN products p ON p.id = oi.product_id GROUP BY oi.order_id) SELECT order_id, total FROM totals WHERE total > 1000;"
"cte-1.check1.fail" = "Sua última consulta não devolve as linhas pedidas (ou você ainda não executou nenhuma). Corrija e execute de novo."
"cte-1.check2.fail" = "Use uma cláusula WITH como pedido."
"recursive-cte.title" = "CTEs recursivas"
"recursive-cte.theory" = """
Uma CTE recursiva chama a si mesma: uma consulta âncora dá as primeiras linhas e uma parte recursiva continua produzindo linhas novas a partir das anteriores, até não produzir nenhuma:

  WITH RECURSIVE count(x) AS (
    SELECT 1                        -- âncora
    UNION ALL
    SELECT x + 1 FROM count         -- parte recursiva
    WHERE x < 5                     -- o freio
  )
  SELECT x FROM count;

É assim que o SQL percorre hierarquias (chefes e funcionários, pastas) e monta séries. Sem o freio a consulta nunca termina: aperte Ctrl+C para interrompê-la."""
"rec-1.prompt" = "Com uma CTE recursiva, gere os números de 1 a 10 (uma coluna)."
"rec-1.hint1" = "Âncora: SELECT 1. Parte recursiva: x + 1 enquanto x < 10."
"rec-1.hint2" = "WITH RECURSIVE n(x) AS (SELECT 1 UNION ALL SELECT x + 1 FROM n WHERE x < 10) SELECT x FROM n;"
"rec-1.check1.fail" = "Sua última consulta não devolve as linhas pedidas (ou você ainda não executou nenhuma). Corrija e execute de novo."
"rec-1.check2.fail" = "Use WITH RECURSIVE como pedido."
"rec-2.prompt" = "Mostre Bruno e todos que se reportam a ele, direta ou indiretamente, com sua profundidade (name, depth). Bruno é profundidade 0, seus subordinados 1, e assim por diante."
"rec-2.hint1" = "Âncora: Bruno com depth 0. Parte recursiva: funcionários cujo manager_id está na CTE, depth + 1."
"rec-2.hint2" = "WITH RECURSIVE team(id, name, depth) AS (SELECT id, name, 0 FROM employees WHERE name = 'Bruno' UNION ALL SELECT e.id, e.name, t.depth + 1 FROM employees e JOIN team t ON e.manager_id = t.id) SELECT name, depth FROM team;"
"rec-2.check1.fail" = "Sua última consulta não devolve as linhas pedidas (ou você ainda não executou nenhuma). Corrija e execute de novo."
"rec-2.check2.fail" = "Use WITH RECURSIVE como pedido."
