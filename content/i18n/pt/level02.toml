"coalesce-cast.title" = "COALESCE e CAST"
"coalesce-cast.theory" = """
coalesce(a, b, ...) devolve o primeiro valor que não é NULL, a forma padrão de dar um valor padrão:

  SELECT name, coalesce(email, 'no email') AS contact FROM customers;

CAST(x AS tipo) converte um valor para INTEGER, REAL ou TEXT:

  SELECT CAST(price AS INTEGER) FROM products;     -- 3.5 vira 3 (os decimais são cortados)
  SELECT CAST(42 AS TEXT) || ' items';

Parentes: ifnull(a, b) é coalesce com dois argumentos e nullif(a, b) dá NULL quando a = b."""
"coalesce-1.prompt" = "Mostre o nome de cada cliente e seu email, ou o texto unknown quando não tem (coluna contact)."
"coalesce-1.hint1" = "coalesce(email, 'unknown') escolhe o primeiro valor que não é NULL."
"coalesce-1.hint2" = "SELECT name, coalesce(email, 'unknown') AS contact FROM customers;"
"coalesce-1.check1.fail" = "Sua última consulta não devolve as linhas pedidas (ou você ainda não executou nenhuma). Corrija e execute de novo."
