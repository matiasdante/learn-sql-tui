"fts5.title" = "Busca de texto completo com FTS5"
"fts5.theory" = """
LIKE '%palavra%' lê todas as linhas e não consegue ordenar por relevância. O FTS5 monta um índice de texto completo em uma tabela virtual:

  CREATE VIRTUAL TABLE docs USING fts5(title, body);
  INSERT INTO docs VALUES ('Joins', 'A join combines rows from two tables');
  SELECT title FROM docs WHERE docs MATCH 'rows';
  SELECT title FROM docs WHERE docs MATCH 'body:join OR title:index' ORDER BY rank;

O MATCH entende palavras, AND / OR / NOT, "frases exatas", prefixos (data*) e filtros por coluna (title:sql). ORDER BY rank ordena por relevância. O FTS5 vem incluído no SQLite embutido neste programa."""
"fts-1.prompt" = "Usando a busca de texto completo (MATCH), mostre o título dos documentos de docs que mencionam a palavra fast."
"fts-1.hint1" = "WHERE docs MATCH 'fast' (o nome da tabela vai à esquerda de MATCH)."
"fts-1.hint2" = "SELECT title FROM docs WHERE docs MATCH 'fast';"
"fts-1.check1.fail" = "Sua última consulta não devolve as linhas pedidas (ou você ainda não executou nenhuma). Corrija e execute de novo."
"fts-1.check2.fail" = "Use MATCH como pedido."
"fts-2.prompt" = "Crie uma tabela virtual FTS5 chamada notes com as colunas title e body, e insira duas notas nela."
"fts-2.hint1" = "CREATE VIRTUAL TABLE notes USING fts5(title, body);"
"fts-2.hint2" = "CREATE VIRTUAL TABLE notes USING fts5(title, body);\nINSERT INTO notes VALUES ('Shopping', 'milk and eggs'), ('Ideas', 'learn full-text search');"
"fts-2.check1.fail" = "notes precisa ser uma tabela virtual USING fts5."
"fts-2.check2.fail" = "notes deveria conter exatamente duas notas."
