"case.title" = "CASE: condições dentro de uma consulta"
"case.theory" = """
CASE é o if/else do SQL. O primeiro WHEN verdadeiro decide o valor:

  SELECT name,
         CASE
           WHEN price >= 500 THEN 'expensive'
           WHEN price >= 50  THEN 'medium'
           ELSE 'cheap'
         END AS tier
  FROM products;

Sem ELSE, uma linha que não cumpre nenhum WHEN recebe NULL."""
"case-1.prompt" = "Mostre o nome de cada produto e uma coluna chamada level: 'out' se o estoque é 0, 'low' se é menor que 20 e 'ok' nos demais casos."
"case-1.hint1" = "Teste primeiro o caso mais específico: stock = 0."
"case-1.hint2" = "SELECT name, CASE WHEN stock = 0 THEN 'out' WHEN stock < 20 THEN 'low' ELSE 'ok' END AS level FROM products;"
