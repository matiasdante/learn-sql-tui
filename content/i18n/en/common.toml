"exam.q1-where.text" = "Which query returns the products that cost more than 100?"
"exam.q1-where.opt1" = "SELECT * FROM products WHERE price > 100;"
"exam.q1-where.opt2" = "SELECT * FROM products IF price > 100;"
"exam.q1-where.opt3" = "SELECT price > 100 FROM products ONLY;"
"exam.q1-where.opt4" = "FILTER products BY price > 100;"
"exam.q1-null.text" = "How do you find the customers that have no email (NULL)?"
"exam.q1-null.opt1" = "WHERE email = NULL"
"exam.q1-null.opt2" = "WHERE email IS NULL"
"exam.q1-null.opt3" = "WHERE email = ''"
"exam.q1-null.opt4" = "WHERE NOT email"
"exam.q2-count.text" = "What is the difference between count(*) and count(email)?"
"exam.q2-count.opt1" = "There is none"
"exam.q2-count.opt2" = "count(email) counts the different emails only"
"exam.q2-count.opt3" = "count(*) ignores the rows with NULL"
"exam.q2-count.opt4" = "count(*) counts all rows; count(email) skips the rows where email is NULL"
"exam.q2-having.text" = "You want the categories that have more than 2 products. Where does the condition go?"
"exam.q2-having.opt1" = "WHERE count(*) > 2, before GROUP BY"
"exam.q2-having.opt2" = "HAVING count(*) > 2, after GROUP BY"
"exam.q2-having.opt3" = "ORDER BY count(*) > 2"
"exam.q2-having.opt4" = "LIMIT count(*) > 2"
"exam.q3-left.text" = "Which join keeps the customers that have no orders?"
"exam.q3-left.opt1" = "customers INNER JOIN orders"
"exam.q3-left.opt2" = "customers CROSS JOIN orders"
"exam.q3-left.opt3" = "customers LEFT JOIN orders"
"exam.q3-left.opt4" = "orders INNER JOIN customers"
"exam.q3-cross.text" = "What happens when a JOIN has no ON condition?"
"exam.q3-cross.opt1" = "It always fails"
"exam.q3-cross.opt2" = "Every row is paired with every row (a cartesian product)"
"exam.q3-cross.opt3" = "It returns no rows"
"exam.q3-cross.opt4" = "It matches rows with the same id"
"exam.q4-exists.text" = "When is EXISTS (subquery) true?"
"exam.q4-exists.opt1" = "When the subquery returns at least one row"
"exam.q4-exists.opt2" = "When the subquery returns the value TRUE"
"exam.q4-exists.opt3" = "When the subquery returns exactly one row"
"exam.q4-exists.opt4" = "When the subquery returns no NULL"
"exam.q4-except.text" = "Which operator returns the rows of the first query that are not in the second?"
"exam.q4-except.opt1" = "UNION"
"exam.q4-except.opt2" = "INTERSECT"
"exam.q4-except.opt3" = "EXCEPT"
"exam.q4-except.opt4" = "JOIN"
"exam.q5-update.text" = "What does UPDATE tasks SET done = 1; do (no WHERE)?"
"exam.q5-update.opt1" = "It fails: WHERE is required"
"exam.q5-update.opt2" = "It updates only the first row"
"exam.q5-update.opt3" = "It updates every row of the table"
"exam.q5-update.opt4" = "It updates nothing"
"exam.q5-upsert.text" = "What does INSERT ... ON CONFLICT DO UPDATE do when the key already exists?"
"exam.q5-upsert.opt1" = "It fails with an error"
"exam.q5-upsert.opt2" = "It inserts a duplicate row"
"exam.q5-upsert.opt3" = "It deletes the old row"
"exam.q5-upsert.opt4" = "It updates the existing row instead of inserting"
