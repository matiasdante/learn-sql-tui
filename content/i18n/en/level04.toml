"cte.title" = "WITH: common table expressions"
"cte.theory" = """
A CTE gives a name to a subquery so the main query reads top to bottom:

  WITH totals AS (
    SELECT order_id, sum(quantity) AS items
    FROM order_items
    GROUP BY order_id
  )
  SELECT order_id, items FROM totals WHERE items > 5;

Think of it as a temporary view that lives for one statement. You can define several, separated by commas, and later ones can use earlier ones."""
"cte-1.prompt" = "Use a WITH clause to compute the total of each order (sum of quantity times price) and show the orders whose total is above 1000, as order_id and total."
"cte-1.hint1" = "In the CTE: JOIN order_items with products and GROUP BY order_id. Then filter the CTE."
"cte-1.hint2" = "WITH totals AS (SELECT oi.order_id, sum(oi.quantity * p.price) AS total FROM order_items oi JOIN products p ON p.id = oi.product_id GROUP BY oi.order_id) SELECT order_id, total FROM totals WHERE total > 1000;"
"cte-1.check1.fail" = "Your last query does not return the rows asked for (or you have not run one yet). Fix it and run it again."
"cte-1.check2.fail" = "Use a WITH clause as asked."
"recursive-cte.title" = "Recursive CTEs"
"recursive-cte.theory" = """
A recursive CTE calls itself: an anchor query gives the first rows, and a recursive part keeps producing new rows from the previous ones, until it produces none:

  WITH RECURSIVE count(x) AS (
    SELECT 1                        -- anchor
    UNION ALL
    SELECT x + 1 FROM count         -- recursive part
    WHERE x < 5                     -- the brake
  )
  SELECT x FROM count;

It is how SQL walks hierarchies (bosses and employees, folders) and builds series. Without the brake the query never ends: press Ctrl+C to stop it."""
"rec-1.prompt" = "With a recursive CTE, generate the numbers from 1 to 10 (one column)."
"rec-1.hint1" = "Anchor: SELECT 1. Recursive part: x + 1 while x < 10."
"rec-1.hint2" = "WITH RECURSIVE n(x) AS (SELECT 1 UNION ALL SELECT x + 1 FROM n WHERE x < 10) SELECT x FROM n;"
"rec-1.check1.fail" = "Your last query does not return the rows asked for (or you have not run one yet). Fix it and run it again."
"rec-1.check2.fail" = "Use WITH RECURSIVE as asked."
"rec-2.prompt" = "Show Bruno and everyone who reports to him, directly or not, with their depth (name, depth). Bruno is depth 0, his reports depth 1, and so on."
"rec-2.hint1" = "Anchor: Bruno with depth 0. Recursive part: employees whose manager_id is in the CTE, depth + 1."
"rec-2.hint2" = "WITH RECURSIVE team(id, name, depth) AS (SELECT id, name, 0 FROM employees WHERE name = 'Bruno' UNION ALL SELECT e.id, e.name, t.depth + 1 FROM employees e JOIN team t ON e.manager_id = t.id) SELECT name, depth FROM team;"
"rec-2.check1.fail" = "Your last query does not return the rows asked for (or you have not run one yet). Fix it and run it again."
"rec-2.check2.fail" = "Use WITH RECURSIVE as asked."
