"subqueries.title" = "子查询：查询中的查询"
"subqueries.theory" = """
子查询是放在括号里的 SELECT，可以当作一个值或一个列表使用。标量子查询返回单个值：

  SELECT name, price FROM products
  WHERE price > (SELECT avg(price) FROM products);

返回一列的子查询可以交给 IN 使用：

  SELECT name FROM customers
  WHERE id IN (SELECT customer_id FROM orders);

内层查询先执行，外层查询使用它的结果。"""
"subq-1.prompt" = "显示价格高于所有商品平均价格的商品的名称和价格。"
"subq-1.hint1" = "把 price 与 (SELECT avg(price) FROM products) 比较。"
"subq-1.hint2" = "SELECT name, price FROM products WHERE price > (SELECT avg(price) FROM products);"
"subq-1.check1.fail" = "你最近一次查询返回的行与要求不符（或者还没有执行查询）。请修改后重新执行。"
"subq-2.prompt" = "显示至少下过一个订单的客户姓名。"
"subq-2.hint1" = "id IN (SELECT customer_id FROM orders)。"
"subq-2.hint2" = "SELECT name FROM customers WHERE id IN (SELECT customer_id FROM orders);"
"subq-2.check1.fail" = "你最近一次查询返回的行与要求不符（或者还没有执行查询）。请修改后重新执行。"
"exists-correlated.title" = "EXISTS 与相关子查询"
"exists-correlated.theory" = """
相关子查询会引用外层查询的列，因此每处理一行外层数据就执行一次。当子查询至少返回一行时，EXISTS 为真：

  SELECT name FROM customers c
  WHERE EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.id);

用 EXISTS 时子查询选什么列无所谓（习惯写 SELECT 1）。相关性也可以用于取值：

  SELECT name, price, category FROM products p
  WHERE price > (SELECT avg(price) FROM products WHERE category = p.category);

NOT EXISTS 保留没有匹配的行；与 NOT IN 不同，子查询里含有 NULL 时它依然安全。"""
"exists-1.prompt" = "使用 EXISTS，显示至少有一个 pending 状态订单的客户姓名。"
"exists-1.hint1" = "子查询查找该客户 status = 'pending' 的订单。"
"exists-1.hint2" = "SELECT name FROM customers c WHERE EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.id AND o.status = 'pending');"
"exists-1.check1.fail" = "你最近一次查询返回的行与要求不符（或者还没有执行查询）。请修改后重新执行。"
"exists-1.check2.fail" = "请按要求使用 EXISTS。"
"corr-1.prompt" = "显示价格高于其所在类别平均价格的商品的名称、类别和价格。"
"corr-1.hint1" = "子查询对 category = p.category（外层当前行）的商品求平均。"
"corr-1.hint2" = "SELECT name, category, price FROM products p WHERE price > (SELECT avg(price) FROM products WHERE category = p.category);"
"corr-1.check1.fail" = "你最近一次查询返回的行与要求不符（或者还没有执行查询）。请修改后重新执行。"
"set-operations.title" = "UNION、INTERSECT 和 EXCEPT"
"set-operations.theory" = """
集合运算用来合并两个列数相同的 SELECT 的结果：

  UNION       两者的行，去重（UNION ALL 保留重复，速度更快）
  INTERSECT   两者都有的行
  EXCEPT      第一个结果里有、第二个结果里没有的行

  SELECT id FROM customers
  EXCEPT
  SELECT customer_id FROM orders;       -- 没有订单的客户

只允许有一个 ORDER BY，且必须放在最后。"""
"union-1.prompt" = "显示一个列表，包含来自 UK 的客户姓名以及来自 Boston 的客户姓名。"
"union-1.hint1" = "两个 SELECT 用 UNION 连接。"
"union-1.hint2" = "SELECT name FROM customers WHERE country = 'UK' UNION SELECT name FROM customers WHERE city = 'Boston';"
"union-1.check1.fail" = "你最近一次查询返回的行与要求不符（或者还没有执行查询）。请修改后重新执行。"
"union-1.check2.fail" = "请按要求使用 UNION。"
