"cte.title" = "WITH：公用表表达式"
"cte.theory" = """
CTE 给子查询起一个名字，让主查询可以自上而下地阅读：

  WITH totals AS (
    SELECT order_id, sum(quantity) AS items
    FROM order_items
    GROUP BY order_id
  )
  SELECT order_id, items FROM totals WHERE items > 5;

可以把它看作只存活于一条语句的临时视图。可以定义多个，用逗号分隔，后面的可以使用前面的。"""
"cte-1.prompt" = "用 WITH 子句计算每个订单的总额（数量乘以价格之和），并显示总额超过 1000 的订单，列名为 order_id 和 total。"
"cte-1.hint1" = "在 CTE 中：order_items 与 products 做 JOIN 并按 order_id 分组；然后再过滤这个 CTE。"
"cte-1.hint2" = "WITH totals AS (SELECT oi.order_id, sum(oi.quantity * p.price) AS total FROM order_items oi JOIN products p ON p.id = oi.product_id GROUP BY oi.order_id) SELECT order_id, total FROM totals WHERE total > 1000;"
"cte-1.check1.fail" = "你最近一次查询返回的行与要求不符（或者还没有执行查询）。请修改后重新执行。"
"cte-1.check2.fail" = "请按要求使用 WITH 子句。"
"recursive-cte.title" = "递归 CTE"
"recursive-cte.theory" = """
递归 CTE 会调用自身：锚点查询给出最初的几行，递归部分不断根据上一轮的行产生新行，直到不再产生为止：

  WITH RECURSIVE count(x) AS (
    SELECT 1                        -- 锚点
    UNION ALL
    SELECT x + 1 FROM count         -- 递归部分
    WHERE x < 5                     -- 终止条件
  )
  SELECT x FROM count;

SQL 就是这样遍历层级结构（上司与员工、文件夹）和生成序列的。没有终止条件，查询永远不会结束：按 Ctrl+C 可以中断它。"""
"rec-1.prompt" = "用递归 CTE 生成从 1 到 10 的数字（一列）。"
"rec-1.hint1" = "锚点：SELECT 1。递归部分：x < 10 时产生 x + 1。"
"rec-1.hint2" = "WITH RECURSIVE n(x) AS (SELECT 1 UNION ALL SELECT x + 1 FROM n WHERE x < 10) SELECT x FROM n;"
"rec-1.check1.fail" = "你最近一次查询返回的行与要求不符（或者还没有执行查询）。请修改后重新执行。"
"rec-1.check2.fail" = "请按要求使用 WITH RECURSIVE。"
"rec-2.prompt" = "显示 Bruno 以及所有直接或间接向他汇报的人，并给出层级深度（name、depth）。Bruno 是深度 0，他的下属是 1，依此类推。"
"rec-2.hint1" = "锚点：depth 为 0 的 Bruno。递归部分：manager_id 在 CTE 中的员工，depth + 1。"
"rec-2.hint2" = "WITH RECURSIVE team(id, name, depth) AS (SELECT id, name, 0 FROM employees WHERE name = 'Bruno' UNION ALL SELECT e.id, e.name, t.depth + 1 FROM employees e JOIN team t ON e.manager_id = t.id) SELECT name, depth FROM team;"
"rec-2.check1.fail" = "你最近一次查询返回的行与要求不符（或者还没有执行查询）。请修改后重新执行。"
"rec-2.check2.fail" = "请按要求使用 WITH RECURSIVE。"
