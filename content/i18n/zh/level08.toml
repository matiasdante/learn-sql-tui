"views.title" = "视图：保存下来的查询"
"views.theory" = """
视图就是带名字的 SELECT。它不存储数据：每次查询视图时，SELECT 都会在当前的表上重新执行。

  CREATE VIEW pending_orders AS
    SELECT o.id, c.name
    FROM orders o JOIN customers c ON c.id = o.customer_id
    WHERE o.status = 'pending';

  SELECT * FROM pending_orders;

视图可以隐藏复杂性（很长的连接）、给一个计算起固定的名字，也可以只暴露部分列。用 DROP VIEW 删除。列名可以用 CREATE VIEW v (a, b) AS ... 指定，或者在 SELECT 里用别名。"""
"view-1.prompt" = "创建名为 customer_orders 的视图，包含每位客户的姓名和下单数量，列名为 name 和 orders。没有订单的客户要显示 0。"
"view-1.hint1" = "CREATE VIEW customer_orders AS SELECT ... LEFT JOIN ... GROUP BY ..."
"view-1.hint2" = "CREATE VIEW customer_orders AS SELECT c.name AS name, count(o.id) AS orders FROM customers c LEFT JOIN orders o ON o.customer_id = c.id GROUP BY c.id;"
"view-1.check1.fail" = "视图 customer_orders 还不存在。"
"view-1.check2.fail" = "视图必须返回全部 9 位客户的 name 和 orders（没有订单的为 0）。"
"indexes.title" = "索引"
"indexes.theory" = """
索引是一列或多列的有序副本，让数据库不用读完整张表就能找到行，就像书的目录：

  CREATE INDEX idx_orders_customer ON orders (customer_id);
  CREATE UNIQUE INDEX idx_customers_email ON customers (email);

按索引列过滤或连接的查询会快得多。代价是：索引占用空间，而且每次 INSERT、UPDATE、DELETE 都要同步维护它。所以只给常用于查找的列建索引，而不是全部。PRIMARY KEY 和 UNIQUE 会自动创建自己的索引。DROP INDEX 删除索引；.indexes 列出索引。"""
"index-1.prompt" = "在 orders 的 customer_id 列上创建名为 idx_orders_customer 的索引。"
"index-1.hint1" = "CREATE INDEX 名称 ON 表 (列);"
"index-1.hint2" = "CREATE INDEX idx_orders_customer ON orders (customer_id);"
"index-1.check1.fail" = "orders 上的索引 idx_orders_customer 还不存在。"
"index-1.check2.fail" = "索引必须建在 customer_id 列上。"
"index-2.prompt" = "在 customers 的 email 列上创建名为 idx_customers_email 的 UNIQUE 索引，使两位客户不能使用同一个 email。"
"index-2.hint1" = "CREATE UNIQUE INDEX ..."
"index-2.hint2" = "CREATE UNIQUE INDEX idx_customers_email ON customers (email);"
"index-2.check1.fail" = "customers 上的 UNIQUE 索引 idx_customers_email 还不存在。"
"partial-expression-indexes.title" = "部分索引与表达式索引"
"partial-expression-indexes.theory" = """
部分索引只覆盖满足 WHERE 的那些行。如果你总是在一个很小的子集里查找，它更小，维护代价也更低：

  CREATE INDEX idx_pending ON orders (customer_id) WHERE status = 'pending';

表达式索引保存的是表达式的结果，所以针对该表达式的查找可以用到它：

  CREATE INDEX idx_name_lower ON customers (lower(name));
  SELECT * FROM customers WHERE lower(name) = 'ada lovelace';   -- 可以使用该索引

查询必须写出相同的表达式（对部分索引来说，还要隐含相同的 WHERE），查询计划器才会选用这个索引。"""
"pindex-1.prompt" = "在 orders (customer_id) 上创建名为 idx_pending 的部分索引，只包含 status 为 'pending' 的订单。"
"pindex-1.hint1" = "在 CREATE INDEX 末尾加上 WHERE status = 'pending'。"
"pindex-1.hint2" = "CREATE INDEX idx_pending ON orders (customer_id) WHERE status = 'pending';"
"pindex-1.check1.fail" = "orders 上的索引 idx_pending 还不存在。"
"pindex-1.check2.fail" = "索引必须是部分索引：请加上 WHERE status = 'pending'。"
"eindex-1.prompt" = "在 customers 上用 lower(name) 创建名为 idx_customers_lower_name 的表达式索引。"
"eindex-1.hint1" = "CREATE INDEX 名称 ON customers (lower(name));"
"eindex-1.hint2" = "CREATE INDEX idx_customers_lower_name ON customers (lower(name));"
"eindex-1.check1.fail" = "索引 idx_customers_lower_name 还不存在。"
"eindex-1.check2.fail" = "索引必须建立在表达式 lower(name) 上。"
"explain.title" = "EXPLAIN QUERY PLAN"
"explain.theory" = """
怎么知道一个查询有没有用上索引？查看它的执行计划：

  EXPLAIN QUERY PLAN SELECT * FROM orders WHERE customer_id = 1;

没有索引时你会看到 SCAN orders：数据库逐行扫描。有了 customer_id 的索引后会变成 SEARCH orders USING INDEX idx_orders_customer (customer_id=?)：直接跳到匹配的行。

创建索引前后各看一次计划，确认它确实有帮助。小表出现 SCAN 没关系；大表里频繁查询出现 SCAN，就是最该优先解决的问题。"""
"explain-1.prompt" = "显示 SELECT * FROM orders WHERE customer_id = 1 的查询计划并阅读：没有索引时它应当显示 SCAN。"
"explain-1.hint1" = "EXPLAIN QUERY PLAN 写在 SELECT 前面。"
"explain-1.hint2" = "EXPLAIN QUERY PLAN SELECT * FROM orders WHERE customer_id = 1;"
"explain-1.check1.fail" = "请在 SELECT 之前加上 EXPLAIN QUERY PLAN 并执行。"
"explain-2.prompt" = "让同一个查询用上索引：在 orders(customer_id) 上创建索引，再执行 EXPLAIN QUERY PLAN，看到 SEARCH 取代 SCAN。"
"explain-2.hint1" = "CREATE INDEX ... ON orders (customer_id);，然后 EXPLAIN QUERY PLAN SELECT ..."
"explain-2.hint2" = "CREATE INDEX idx_orders_customer ON orders (customer_id);\nEXPLAIN QUERY PLAN SELECT * FROM orders WHERE customer_id = 1;"
"explain-2.check1.fail" = "orders 需要一个建在 customer_id 上的索引。"
"explain-2.check2.fail" = "请执行 EXPLAIN QUERY PLAN，确认计划已经改变。"
"analyze.title" = "ANALYZE 与查询计划器"
"analyze.theory" = """
当有多个索引都能回答同一个查询时，计划器会估算哪个代价更低。ANALYZE 会收集表和索引的统计信息，保存在 sqlite_stat1 表中，让这些估算更准确：

  ANALYZE;
  SELECT * FROM sqlite_stat1;

在导入大量数据或创建索引之后运行它。PRAGMA optimize 是它的轻量版本，适合在关闭长期连接之前运行。只有带索引的表才会被收集统计信息。"""
"analyze-1.prompt" = "orders 表已有一个索引。请用 ANALYZE 收集数据库的统计信息。"
"analyze-1.hint1" = "直接执行 ANALYZE;（有兴趣可以再看看 sqlite_stat1）。"
"analyze-1.hint2" = "ANALYZE;"
"analyze-1.check1.fail" = "orders 还没有统计信息：请执行 ANALYZE。"
