"exam.q1-where.text" = "哪条查询会返回价格超过 100 的商品？"
"exam.q1-where.opt1" = "SELECT * FROM products WHERE price > 100;"
"exam.q1-where.opt2" = "SELECT * FROM products IF price > 100;"
"exam.q1-where.opt3" = "SELECT price > 100 FROM products ONLY;"
"exam.q1-where.opt4" = "FILTER products BY price > 100;"
"exam.q1-null.text" = "怎样找出没有 email（NULL）的客户？"
"exam.q1-null.opt1" = "WHERE email = NULL"
"exam.q1-null.opt2" = "WHERE email IS NULL"
"exam.q1-null.opt3" = "WHERE email = ''"
"exam.q1-null.opt4" = "WHERE NOT email"
"exam.q2-count.text" = "count(*) 和 count(email) 有什么区别？"
"exam.q2-count.opt1" = "没有区别"
"exam.q2-count.opt2" = "count(email) 只统计不同的 email"
"exam.q2-count.opt3" = "count(*) 会忽略含 NULL 的行"
"exam.q2-count.opt4" = "count(*) 统计所有行；count(email) 跳过 email 为 NULL 的行"
"exam.q2-having.text" = "你想找出商品数超过 2 个的类别。条件应该写在哪里？"
"exam.q2-having.opt1" = "WHERE count(*) > 2，写在 GROUP BY 之前"
"exam.q2-having.opt2" = "HAVING count(*) > 2，写在 GROUP BY 之后"
"exam.q2-having.opt3" = "ORDER BY count(*) > 2"
"exam.q2-having.opt4" = "LIMIT count(*) > 2"
"exam.q3-left.text" = "哪种连接会保留没有订单的客户？"
"exam.q3-left.opt1" = "customers INNER JOIN orders"
"exam.q3-left.opt2" = "customers CROSS JOIN orders"
"exam.q3-left.opt3" = "customers LEFT JOIN orders"
"exam.q3-left.opt4" = "orders INNER JOIN customers"
"exam.q3-cross.text" = "JOIN 没有 ON 条件时会发生什么？"
"exam.q3-cross.opt1" = "一定报错"
"exam.q3-cross.opt2" = "每一行都与所有行配对（笛卡尔积）"
"exam.q3-cross.opt3" = "不返回任何行"
"exam.q3-cross.opt4" = "按相同的 id 匹配行"
"exam.q4-exists.text" = "EXISTS (子查询) 在什么时候为真？"
"exam.q4-exists.opt1" = "子查询至少返回一行时"
"exam.q4-exists.opt2" = "子查询返回值 TRUE 时"
"exam.q4-exists.opt3" = "子查询恰好返回一行时"
"exam.q4-exists.opt4" = "子查询没有返回 NULL 时"
"exam.q4-except.text" = "哪个运算符返回第一个查询中有、第二个查询中没有的行？"
"exam.q4-except.opt1" = "UNION"
"exam.q4-except.opt2" = "INTERSECT"
"exam.q4-except.opt3" = "EXCEPT"
"exam.q4-except.opt4" = "JOIN"
"exam.q5-update.text" = "UPDATE tasks SET done = 1;（没有 WHERE）会做什么？"
"exam.q5-update.opt1" = "报错：WHERE 是必需的"
"exam.q5-update.opt2" = "只更新第一行"
"exam.q5-update.opt3" = "更新表中的每一行"
"exam.q5-update.opt4" = "什么都不更新"
