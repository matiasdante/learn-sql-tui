[[exercise]]
id = "tx-1"
hints = 2
solution = ["BEGIN;\nUPDATE accounts SET balance = balance - 30 WHERE id = 1;\nUPDATE accounts SET balance = balance + 30 WHERE id = 2;\nCOMMIT;"]
setup = [
  { do = "sql", script = "CREATE TABLE accounts (id INTEGER PRIMARY KEY, owner TEXT NOT NULL, balance INTEGER NOT NULL CHECK (balance >= 0)); INSERT INTO accounts VALUES (1, 'Ada', 100), (2, 'Grace', 50);" },
]
checks = [
  { type = "query_equals", sql = "SELECT balance FROM accounts ORDER BY id", rows = [["70"], ["80"]] },
  { type = "autocommit" },
  { type = "ran", any = ["BEGIN"] },
]

