[package]
name = "learn-sql-tui"
version = "1.0.1"
edition = "2024"
description = "Learn SQL by practicing real SQL (embedded SQLite) inside a terminal UI"
repository = "https://github.com/matiasdante/learn-sql-tui"
license = "MIT"
authors = ["Matias Dante Sarco"]

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
include_dir = "0.7.4"
# SQLite compilado dentro del binario: el usuario no instala nada.
rusqlite = { version = "0.41.1", features = ["bundled", "hooks"] }
ratatui = "0.29"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.0"
tui-textarea = "0.7.0"
